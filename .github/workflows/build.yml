name: build profile

# One live thing on this profile: the merged-PR counts. They are fetched here,
# written into README.md between HTML sentinels, and committed -- so the rendered
# page never depends on a third-party service being up when a visitor arrives.
#
# There used to be a contribution-snake step and three Vercel-hosted stat cards.
# Two of the three cards were dead on the live page. Everything drawn on this
# profile is now generated by build/render.py and served from this repository,
# which is the only way to guarantee it is there when someone looks.

on:
  schedule:
    - cron: "37 5 * * *"        # 05:37 UTC -- deliberately off the hour; every
                               # cron job on GitHub fires at :00 and gets queued
  workflow_dispatch:            # so I can force a rebuild by hand
  push:
    branches: [main, master]    # whichever this repo actually uses
    paths:                      # don't rebuild when only prose changed
      - "build/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write               # the job commits back to this repo

concurrency:                    # a manual run should not race the nightly one
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # render.py, verify.py and build_readme.py are standard library only.

      - name: Render plates, rewrite the live regions, check the geometry
        env:
          # secrets.GITHUB_TOKEN is scoped to this repository and can undercount
          # merges in repositories I do not own. Set a PROFILE_TOKEN secret (a PAT
          # with public_repo) and it is used in preference. build_readme.py refuses
          # to publish a count lower than the one already in the file either way.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python build/build_readme.py

      - name: Commit only if something actually changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets
          if git diff --cached --quiet; then
            echo "nothing changed -- no commit"
          else
            git commit -m "profile: rebuild plates and refresh live counts [skip ci]"
            git push
          fi
