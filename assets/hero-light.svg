<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-label="Manav Sharma — ML research, systems and compilers"><title>Manav Sharma — ML research, systems and compilers</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FAFC"/>
</linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#7C3AED" stop-opacity=".28"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#0891B2" stop-opacity=".28"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
<radialGradient id="b3"><stop offset="0" stop-color="#DB2777" stop-opacity=".28"/><stop offset="1" stop-color="#DB2777" stop-opacity="0"/></radialGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#0F172A"/><stop offset=".55" stop-color="#7C3AED"/><stop offset="1" stop-color="#0891B2"/>
</linearGradient>
<linearGradient id="ul" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#7C3AED"/><stop offset=".5" stop-color="#0891B2"/><stop offset="1" stop-color="#DB2777"/>
</linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
  <circle cx="1.2" cy="1.2" r="1.2" fill="#94A3B8" fill-opacity=".5"/>
</pattern>
<linearGradient id="vig" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#000"/><stop offset=".28" stop-color="#fff"/>
  <stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
</linearGradient>
<mask id="mgrid"><rect width="1600" height="440" fill="url(#vig)"/></mask>
<clipPath id="nameclip"><text x="800.0" y="238.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="104" fill="#000" text-anchor="middle" dx="-1.00" letter-spacing="2" font-weight="800">MANAV SHARMA</text></clipPath>
<clipPath id="frame"><rect width="1600" height="440" rx="0"/></clipPath>
</defs>
<style>/*<![CDATA[*/
*{transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes halo{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(3.2);opacity:0}}
.rise{opacity:0;animation:rise .75s cubic-bezier(.22,1,.36,1) forwards}
.fade{opacity:0;animation:fade .9s ease-out forwards}
.halo{animation:halo 2.6s ease-out infinite}

@keyframes d1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(90px,34px) scale(1.18)}}
@keyframes d2{0%,100%{transform:translate(0,0) scale(1.08)}50%{transform:translate(-70px,-40px) scale(.92)}}
@keyframes d3{0%,100%{transform:translate(0,0) scale(.95)}50%{transform:translate(46px,58px) scale(1.2)}}
.a1{animation:d1 23s ease-in-out infinite}
.a2{animation:d2 29s ease-in-out infinite}
.a3{animation:d3 26s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-780px)}42%,100%{transform:translateX(780px)}}
.gloss{animation:sweep 7s cubic-bezier(.5,0,.5,1) infinite}
/*]]>*/</style>
<g clip-path="url(#frame)">
<rect x="0.0" y="0.0" width="1600.0" height="440.0" fill="url(#sky)"/>
<g style="filter:blur(96px)"><g class="a1"><circle cx="300.0" cy="118.0" r="250" fill="url(#b1)"/></g><g class="a2"><circle cx="1310.0" cy="336.0" r="268" fill="url(#b2)"/></g><g class="a3"><circle cx="838.0" cy="-46.0" r="224" fill="url(#b3)"/></g></g>
<rect width="1600" height="440" fill="url(#grid)" mask="url(#mgrid)"/>
<g class="fade" style="animation-delay:.15s">
<circle cx="93.0" cy="62.0" r="4.5" fill="#059669"/>
<circle cx="93.0" cy="62.0" r="4.5" fill="#059669" class="halo"/>
<text x="110.0" y="67.0" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#475569" letter-spacing="1.5">OPEN TO RESEARCH &amp; SYSTEMS ROLES</text>
<text x="1512.0" y="67.0" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#475569" text-anchor="end" dx="-0.75" letter-spacing="1.5">IEEE ICIPTM 2026  ·  FIRST AUTHOR</text>
</g>
<g class="rise" style="animation-delay:.1s">
<text x="800.0" y="238.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="104" fill="url(#ink)" text-anchor="middle" dx="-1.00" letter-spacing="2" font-weight="800">MANAV SHARMA</text>
<g clip-path="url(#nameclip)"><g class="gloss"><rect x="670.0" y="130.0" width="260.0" height="130.0" fill="url(#gloss)"/></g></g>
</g>
<line x1="560.0" y1="274.0" x2="1040.0" y2="274.0" stroke="url(#ul)" stroke-width="3" stroke-linecap="round" style="stroke-dasharray:480;stroke-dashoffset:480;animation:draw 1.1s .5s cubic-bezier(.22,1,.36,1) forwards"/>
<text x="800" y="326" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="1.8" dx="-0.9" class="rise" style="animation-delay:.42s"><tspan fill="#7C3AED">ML RESEARCH</tspan><tspan fill="#94A3B8">   ·   </tspan><tspan fill="#0891B2">SYSTEMS &amp; COMPILERS</tspan><tspan fill="#94A3B8">   ·   </tspan><tspan fill="#DB2777">MARKET MICROSTRUCTURE</tspan></text>
<g class="rise" style="animation-delay:0.60s">
<rect x="402.6" y="366.0" width="258.2" height="46.0" fill="#7C3AED" rx="23" stroke="#7C3AED" stroke-width="1" fill-opacity=".07" stroke-opacity=".45"/>
<text x="420.6" y="396.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" fill="#7C3AED" font-weight="750">01</text>
<text x="455.6" y="395.0" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#475569" letter-spacing="0.9">IEEE PAPER, FIRST AUTHOR</text>
</g>
<g class="rise" style="animation-delay:0.71s">
<rect x="682.8" y="366.0" width="219.2" height="46.0" fill="#059669" rx="23" stroke="#059669" stroke-width="1" fill-opacity=".07" stroke-opacity=".45"/>
<text x="700.8" y="396.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" fill="#059669" font-weight="750">19</text>
<text x="735.7" y="395.0" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#475569" letter-spacing="0.9">UPSTREAM PRs MERGED</text>
</g>
<g class="rise" style="animation-delay:0.82s">
<rect x="923.9" y="366.0" width="273.5" height="46.0" fill="#0891B2" rx="23" stroke="#0891B2" stroke-width="1" fill-opacity=".07" stroke-opacity=".45"/>
<text x="941.9" y="396.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" fill="#0891B2" font-weight="750">13M+</text>
<text x="1007.8" y="395.0" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#475569" letter-spacing="0.9">ORDER-BOOK ROWS TESTED</text>
</g>
</g></svg>